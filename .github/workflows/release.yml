# Tests every push; a tag like v0.1.0 builds the Linux and Windows programs and
# publishes them as a release (with SHA256SUMS, which the install scripts check).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
      # On Linux this includes the confinement tests: they need Landlock (Linux 6.2+) and fail rather than skip without it.
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -- --nocapture 2>&1 | tee test-output.txt
      # Notes from the tests (e.g. why a shell didn't pass the sandbox check), readable without owner access.
      - name: report notes
        if: always()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          grep -a "check that didn't pass\|^shell:" test-output.txt | head -20 | while IFS= read -r line; do
            line=$(printf '%s' "$line" | tr -d '\r' | cut -c1-3000 | sed 's/%/%25/g')
            echo "::notice title=Sandbox check::$line"
          done
      # Logs are only visible to the repo's owner; a failure note on the run is visible to anyone.
      - name: report failures
        if: failure()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          msg=$( (sed -n '/^failures:/,$p' test-output.txt; grep -E "^error|panicked" test-output.txt) | head -120 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Test failures::${msg:0:60000}"

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, asset: athena-connect-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: athena-connect-linux-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: athena-connect-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir -p dist
          bin=target/${{ matrix.target }}/release/athena-connect
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum athena-connect-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
